AWSTemplateFormatVersion: '2010-09-09'
Description: Lanyard Health Cognito User Pool

# ⚠️  DO NOT APPLY THIS TEMPLATE TO THE LIVE POOL.
#
# It has drifted from production (us-east-1_SXOvfeegD) and applying it would be
# a downgrade, not a sync. Known divergences:
#
#   • MfaConfiguration / EnabledMfas below say OPTIONAL + Authenticator only.
#     The live pool is Require-MFA with Authenticator AND Email, live since
#     2026-06-09 (docs/cognito-mfa-runbook.md). Applying this drops email MFA
#     and locks out everyone enrolled on it.
#   • email_sending_account differs from the live SES sender
#     (invites@lanyardhealth.com).
#
# Treat this file as documentation of intent that we keep matching the console
# by hand. Change the console first, then edit here to match.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
  DomainPrefix:
    Type: String
    Default: lanyard-health

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub lanyard-health-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: false
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        # Kept in sync with the live pool by hand — see the staleness warning at
        # the top of this file. The host must match FRONTEND_URL on kay-backend
        # (https://portal.lanyardhealth.com); pointing it anywhere else is what
        # convinced a customer there were two different Lanyard portals.
        InviteMessageTemplate:
          EmailSubject: Welcome to Lanyard Health
          EmailMessage: "Your admin has created an account for you. Username: {username}, Temporary password: {####}. Log in at https://portal.lanyardhealth.com/login"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub lanyard-health-web-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Description: Cognito User Pool ID
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Description: Cognito User Pool Client ID
  UserPoolDomain:
    Value: !Sub ${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
    Description: Cognito Domain
