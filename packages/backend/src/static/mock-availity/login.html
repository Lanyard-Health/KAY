<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Availity Essentials — Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f6f9; color: #2c3e50; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: white; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 48px 56px; width: 420px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .brand-logo { width: 40px; height: 40px; background: #f57c00; color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; }
    .brand-name { font-size: 24px; font-weight: 600; color: #1a3d6f; }
    h1 { font-size: 20px; margin-bottom: 24px; color: #1a3d6f; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
    button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button:hover { background: #155cc7; }
    .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #94a3b8; text-align: center; }
    .demo-banner { background: #fef3c7; color: #92400e; font-size: 11px; padding: 8px 12px; border-radius: 4px; margin-bottom: 16px; text-align: center; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="demo-banner">DEMO ENVIRONMENT — Lanyard Health Internal</div>
    <div class="brand">
      <div class="brand-logo">A</div>
      <div class="brand-name">Availity</div>
    </div>
    <h1>Sign in to Availity Essentials</h1>
    <form action="/mock-availity/dashboard.html" method="get">
      <div class="form-group">
        <label for="username">User ID</label>
        <input type="text" id="username" name="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" id="login-button">Sign in</button>
    </form>
    <div class="footer">Need help signing in? Contact your organization administrator.</div>
  </div>
</body>
</html>
