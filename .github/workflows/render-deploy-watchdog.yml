name: Render Deploy Watchdog

# Why this exists:
# Render occasionally fails to clone the repo with "could not read Username
# for 'https://github.com'" — a transient GitHub OAuth glitch on Render's
# side. When this happens, Render does NOT auto-retry; the deploy sits at
# build_failed until someone manually re-deploys. This watchdog runs on a
# cron and explicitly retries one time per failed deploy when the failed
# commit still matches current master HEAD.
#
# Safety:
# - Retries at most once per (service, COMMIT SHA). State lives in Render's
#   own deploy history: we count how many deploys exist for the commit and
#   skip if it's already >1. This survives across cron ticks because Render
#   persists the deploy log indefinitely.
# - Only retries `build_failed`. Does NOT retry `update_failed` or
#   `pre_deploy_failed` — those are release-/migration-level errors that
#   need a human; retrying them just adds noise and can mask real problems.
# - Also pulls deploy logs and hard-skips if Prisma migration errors
#   (P3009, P3018) are present, as a belt-and-suspenders against future
#   drift (e.g. if someone moves `prisma migrate` into the build step).
# - Skips retries when the failed commit is no longer master HEAD (a
#   newer push has superseded it — retrying old commits is pointless).
# - All work happens via Render's REST API — no shell into Render.

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be retried without triggering deploys'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  watchdog:
    name: Retry failed Render deploys on master HEAD
    runs-on: ubuntu-latest
    steps:
      - name: Check and retry failed deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -eo pipefail

          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY secret not set"
            exit 1
          fi

          # Render workspace owner — required for the /v1/logs API.
          RENDER_OWNER_ID="tea-d61unukr85hc7387vg80"

          # Services this watchdog watches. Add new services by appending here.
          SERVICES='[
            {"id":"srv-d6212t7pm1nc73fjkdk0","name":"kay-backend"},
            {"id":"srv-d8fn3628qa3s73afc9q0","name":"kay-backend-staging"},
            {"id":"srv-d622jvonputs739dmck0","name":"kay-frontend"}
          ]'

          # Fetch current master HEAD via GitHub API (avoids needing checkout).
          MASTER_HEAD=$(gh api "repos/$OWNER/$REPO/commits/master" --jq '.sha')
          echo "Master HEAD: $MASTER_HEAD"
          echo "Dry run: ${DRY_RUN:-false}"
          echo

          retried=0
          skipped_already_live=0
          skipped_stale_commit=0
          skipped_not_retryable=0
          skipped_retry_cap=0
          skipped_migration_error=0

          for row in $(echo "$SERVICES" | jq -c '.[]'); do
            ID=$(echo "$row" | jq -r '.id')
            NAME=$(echo "$row" | jq -r '.name')

            # Fetch recent deploys (need >1 so we can detect prior retries for the same commit).
            DEPLOYS_JSON=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$ID/deploys?limit=10")
            LATEST=$(echo "$DEPLOYS_JSON" | jq -r '.[0].deploy')
            STATUS=$(echo "$LATEST" | jq -r '.status')
            COMMIT=$(echo "$LATEST" | jq -r '.commit.id // ""')
            DEPLOY_ID=$(echo "$LATEST" | jq -r '.id')

            echo "  $NAME: status=$STATUS commit=${COMMIT:0:7} deploy=$DEPLOY_ID"

            if [ "$STATUS" = "live" ]; then
              skipped_already_live=$((skipped_already_live + 1))
              continue
            fi

            # Only build_failed is a candidate. update_failed and pre_deploy_failed
            # are release-level errors (broken start command, migration that won't
            # apply, env var mismatch) — no amount of retrying fixes them, and
            # retrying masks the real problem from the operator.
            if [ "$STATUS" != "build_failed" ]; then
              echo "    skipped — status '$STATUS' is not retryable (only build_failed)"
              skipped_not_retryable=$((skipped_not_retryable + 1))
              continue
            fi

            if [ "$COMMIT" != "$MASTER_HEAD" ]; then
              echo "    skipped — failed commit ${COMMIT:0:7} is not current master HEAD ${MASTER_HEAD:0:7}"
              skipped_stale_commit=$((skipped_stale_commit + 1))
              continue
            fi

            # Per-commit retry cap. Uses Render's deploy history as durable state:
            # if >1 deploy exists for this commit, we (or a human) have already
            # retried it at least once. Survives cron ticks because Render keeps
            # the deploy log indefinitely.
            PRIOR_COUNT=$(echo "$DEPLOYS_JSON" | jq "[.[] | select(.deploy.commit.id == \"$COMMIT\")] | length")
            if [ "$PRIOR_COUNT" -gt 1 ]; then
              echo "    skipped — commit ${COMMIT:0:7} already has $PRIOR_COUNT deploys (max 1 retry per commit)"
              skipped_retry_cap=$((skipped_retry_cap + 1))
              continue
            fi

            # Belt-and-suspenders: if the deploy logs show a Prisma migration
            # error code, that's a structural failure no retry can fix. Hard-skip
            # with a clear log line so the operator sees it in the workflow summary.
            LOG_START=$(echo "$LATEST" | jq -r '.createdAt // empty')
            LOG_END=$(echo "$LATEST" | jq -r '.finishedAt // .updatedAt // empty')
            if [ -n "$LOG_START" ] && [ -n "$LOG_END" ]; then
              LOG_BODY=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/logs?ownerId=$RENDER_OWNER_ID&resource=$ID&startTime=$LOG_START&endTime=$LOG_END&limit=200&direction=backward" \
                2>/dev/null || echo '{}')
              if echo "$LOG_BODY" | grep -qE 'P3009|P3018'; then
                echo "    skipped — Prisma migration error (P3009/P3018) detected; needs human"
                skipped_migration_error=$((skipped_migration_error + 1))
                continue
              fi
            fi

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "    [DRY RUN] would trigger retry deploy for commit ${COMMIT:0:7}"
              retried=$((retried + 1))
              continue
            fi

            echo "    triggering retry for commit ${COMMIT:0:7}..."
            RESULT=$(curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$ID/deploys" \
              -d '{"clearCache":"do_not_clear"}')
            NEW_ID=$(echo "$RESULT" | jq -r '.id')
            echo "    -> new deploy $NEW_ID triggered"
            retried=$((retried + 1))
          done

          {
            echo "## Render Deploy Watchdog"
            echo
            echo "- Master HEAD: \`$MASTER_HEAD\`"
            echo "- Retried: $retried"
            echo "- Skipped (already live): $skipped_already_live"
            echo "- Skipped (status not retryable): $skipped_not_retryable"
            echo "- Skipped (failed commit ≠ HEAD): $skipped_stale_commit"
            echo "- Skipped (retry cap reached for commit): $skipped_retry_cap"
            echo "- Skipped (Prisma migration error in logs): $skipped_migration_error"
          } >> "$GITHUB_STEP_SUMMARY"
