name: Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      summary: ${{ steps.parse.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          fetch-depth: 0

      - name: Checkout (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        id: checkout-retry1
        continue-on-error: true
        with:
          fetch-depth: 0

      - name: Checkout (retry 2)
        if: steps.checkout-retry1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Parse Gitleaks Results
        if: always()
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let findings = [];
            let status = 'pass';
            try {
              const report = fs.readFileSync('results.sarif', 'utf8');
              const sarif = JSON.parse(report);
              findings = sarif.runs?.[0]?.results || [];
              if (findings.length > 0) status = 'fail';
            } catch (e) {
              // No SARIF file means no findings
            }
            const summary = findings.length === 0
              ? '### :white_check_mark: Gitleaks: No secrets detected'
              : `### :x: Gitleaks: ${findings.length} secret(s) detected\n\n` +
                findings.map(f =>
                  `- **${f.ruleId}**: ${f.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'unknown file'} (line ${f.locations?.[0]?.physicalLocation?.region?.startLine || '?'})`
                ).join('\n');
            core.setOutput('status', status);
            core.setOutput('summary', summary);

      - name: Upload Gitleaks Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-summary
          path: results.sarif
          if-no-files-found: ignore

  npm-audit:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      summary: ${{ steps.parse.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true

      - name: Checkout (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        id: checkout-retry1
        continue-on-error: true

      - name: Checkout (retry 2)
        if: steps.checkout-retry1.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit (production only)
        id: audit-prod
        continue-on-error: true
        run: |
          npm audit --omit=dev --json > npm-audit-prod.json 2>&1 || true

      - name: Run npm audit (all, informational)
        id: audit-all
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-all.json 2>&1 || true

      - name: Parse Audit Results
        if: always()
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let status = 'pass';
            let summary = '';

            function parseAudit(filePath) {
              const raw = fs.readFileSync(filePath, 'utf8');
              const audit = JSON.parse(raw);
              const vulns = audit.vulnerabilities || {};
              let high = 0, critical = 0, moderate = 0, low = 0;
              const highCritList = [];
              for (const [name, info] of Object.entries(vulns)) {
                const sev = info.severity;
                if (sev === 'critical') { critical++; highCritList.push(`- **CRITICAL**: \`${name}\` - ${info.via?.[0]?.title || info.via?.[0] || 'unknown'}`); }
                else if (sev === 'high') { high++; highCritList.push(`- **HIGH**: \`${name}\` - ${info.via?.[0]?.title || info.via?.[0] || 'unknown'}`); }
                else if (sev === 'moderate') moderate++;
                else low++;
              }
              return { high, critical, moderate, low, highCritList };
            }

            try {
              const prod = parseAudit('npm-audit-prod.json');
              const all = parseAudit('npm-audit-all.json');
              const devOnly = {
                high: all.high - prod.high,
                critical: all.critical - prod.critical,
                moderate: all.moderate - prod.moderate,
                low: all.low - prod.low,
              };

              // Only fail on critical production vulnerabilities
              if (prod.critical > 0) {
                status = 'fail';
                summary = `### :x: npm audit: ${prod.critical} critical (production) — blocking\n\n` +
                  prod.highCritList.filter(l => l.includes('**CRITICAL**')).join('\n');
              }
              if (prod.high > 0) {
                const highWarning = `### :warning: npm audit: ${prod.high} high (production, not blocking)\n\n` +
                  prod.highCritList.filter(l => l.includes('**HIGH**')).join('\n');
                summary = summary ? summary + '\n\n' + highWarning : highWarning;
              }
              if (prod.moderate + prod.low > 0) {
                const mlWarning = `### :information_source: npm audit: ${prod.moderate} moderate, ${prod.low} low (production, not blocking)`;
                summary = summary ? summary + '\n\n' + mlWarning : mlWarning;
              }
              if (!summary) {
                summary = '### :white_check_mark: npm audit: No production vulnerabilities';
              }

              const devTotal = devOnly.high + devOnly.critical + devOnly.moderate + devOnly.low;
              if (devTotal > 0) {
                summary += `\n\n*Dev-only: ${devOnly.critical} critical, ${devOnly.high} high, ${devOnly.moderate} moderate, ${devOnly.low} low (not blocking)*`;
              }
            } catch (e) {
              summary = '### :white_check_mark: npm audit: No known vulnerabilities';
            }
            core.setOutput('status', status);
            core.setOutput('summary', summary);

      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-summary
          path: |
            npm-audit-prod.json
            npm-audit-all.json
          if-no-files-found: ignore

  eslint-security:
    name: Code Security Lint (ESLint)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      summary: ${{ steps.parse.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true

      - name: Checkout (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        id: checkout-retry1
        continue-on-error: true

      - name: Checkout (retry 2)
        if: steps.checkout-retry1.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Security Scan
        id: eslint
        continue-on-error: true
        run: |
          npx eslint \
            "packages/*/src/**/*.{ts,tsx}" \
            --format json \
            --output-file eslint-results.json \
            || true

      - name: Parse ESLint Results
        if: always()
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let status = 'pass';
            let summary = '';
            try {
              const raw = fs.readFileSync('eslint-results.json', 'utf8');
              const results = JSON.parse(raw);
              let errorCount = 0;
              let warnCount = 0;
              const securityErrors = [];
              const securityWarnings = [];
              for (const file of results) {
                for (const msg of file.messages) {
                  const ruleId = msg.ruleId || '';
                  const isSecurityRule = ruleId.startsWith('security/');
                  if (!isSecurityRule) continue;
                  const relPath = file.filePath.replace(/.*\/packages\//, 'packages/');
                  const entry = `- \`${ruleId}\`: ${relPath}:${msg.line} - ${msg.message}`;
                  if (msg.severity === 2) {
                    errorCount++;
                    securityErrors.push(entry);
                  } else {
                    warnCount++;
                    securityWarnings.push(entry);
                  }
                }
              }
              if (errorCount > 0) {
                status = 'fail';
                summary = `### :x: ESLint Security: ${errorCount} error(s), ${warnCount} warning(s)\n\n`;
                summary += '**Errors (blocking):**\n' + securityErrors.slice(0, 20).join('\n');
                if (securityErrors.length > 20) summary += `\n...and ${securityErrors.length - 20} more`;
                if (warnCount > 0) {
                  summary += '\n\n**Warnings (non-blocking):**\n' + securityWarnings.slice(0, 10).join('\n');
                  if (securityWarnings.length > 10) summary += `\n...and ${securityWarnings.length - 10} more`;
                }
              } else if (warnCount > 0) {
                summary = `### :warning: ESLint Security: ${warnCount} warning(s) (no errors)\n\n` +
                  securityWarnings.slice(0, 15).join('\n');
                if (securityWarnings.length > 15) summary += `\n...and ${securityWarnings.length - 15} more`;
              } else {
                summary = '### :white_check_mark: ESLint Security: No security issues found';
              }
            } catch (e) {
              summary = `### :grey_question: ESLint Security: Could not parse results\n\nError: ${e.message}`;
            }
            core.setOutput('status', status);
            core.setOutput('summary', summary);

      - name: Upload ESLint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-security-summary
          path: eslint-results.json
          if-no-files-found: ignore

  semgrep:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      summary: ${{ steps.parse.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true

      - name: Checkout (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        id: checkout-retry1
        continue-on-error: true

      - name: Checkout (retry 2)
        if: steps.checkout-retry1.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/nodejs \
            --config p/typescript \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'infrastructure' \
            --exclude '*.test.ts' \
            --exclude 'package-lock.json' \
            --json \
            --output semgrep-results.json \
            packages/ \
            || true

      - name: Parse Semgrep Results
        if: always()
        id: parse
        shell: python3 {0}
        run: |
          import json, os, uuid

          status = 'pass'
          summary = ''
          try:
              with open('semgrep-results.json') as f:
                  data = json.load(f)
              results = data.get('results', [])
              high_crit = []
              medium = []
              low_info = []
              for r in results:
                  sev = r.get('extra', {}).get('severity', 'INFO').upper()
                  check_id = r.get('check_id', 'unknown')
                  path = r.get('path', 'unknown')
                  line = r.get('start', {}).get('line', '?')
                  msg = r.get('extra', {}).get('message', 'No description')
                  if len(msg) > 120:
                      msg = msg[:120] + '...'
                  entry = f"- **{sev}** `{check_id}`: {path}:{line} - {msg}"
                  if sev in ('ERROR', 'WARNING', 'HIGH', 'CRITICAL'):
                      high_crit.append(entry)
                  elif sev == 'MEDIUM':
                      medium.append(entry)
                  else:
                      low_info.append(entry)
              if high_crit:
                  status = 'fail'
                  summary = f"### :x: Semgrep: {len(high_crit)} high/critical, {len(medium)} medium, {len(low_info)} low/info\n\n"
                  summary += "**High/Critical (blocking):**\n" + "\n".join(high_crit[:20])
                  if len(high_crit) > 20:
                      summary += f"\n...and {len(high_crit) - 20} more"
              elif medium:
                  summary = f"### :warning: Semgrep: {len(medium)} medium, {len(low_info)} low/info (no high/critical)\n\n"
                  summary += "\n".join(medium[:15])
              elif low_info:
                  summary = f"### :information_source: Semgrep: {len(low_info)} low/info findings only"
              else:
                  summary = "### :white_check_mark: Semgrep: No security issues found"
          except Exception as e:
              summary = f"### :grey_question: Semgrep: Could not parse results\n\nError: {e}"

          delimiter = uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"status={status}\n")
              f.write(f"summary<<{delimiter}\n{summary}\n{delimiter}\n")

      - name: Upload Semgrep Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-summary
          path: semgrep-results.json
          if-no-files-found: ignore

  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
      summary: ${{ steps.check.outputs.summary }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: credentials
          POSTGRES_PASSWORD: credentials_dev_password
          POSTGRES_DB: credentials_shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U credentials"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Schema Drift
        id: check
        working-directory: packages/backend
        run: |
          DIFF_OUTPUT=$(npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://credentials:credentials_dev_password@localhost:5433/credentials_shadow" \
            --exit-code 2>&1) && EXIT_CODE=0 || EXIT_CODE=$?

          # Known-ignorable drift: Prisma 5.12 doesn't support `type: Hnsw` in schema.prisma,
          # so HNSW indexes on Unsupported("vector(N)") columns can only live in raw-SQL migrations.
          # `migrate diff` will always report this as drift on the embedding column.
          # We compare only the actionable diff markers ([+], [-], [*]) — informational lines
          # like "Drift detected" are ignored. If those markers exactly match the expected
          # HNSW pair, treat as pass. Any other marker still fails.
          ACTUAL_MARKERS=$(printf '%s\n' "$DIFF_OUTPUT" | grep -E '\[[+*-]\]' | sed 's/^[[:space:]]*//' | sort)
          EXPECTED_MARKERS=$(printf '%s\n%s\n' '[*] Changed the `knowledge_base_embeddings` table' '[-] Removed index on columns (embedding)' | sort)

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "summary=### :white_check_mark: Schema Drift: Migrations match schema.prisma" >> "$GITHUB_OUTPUT"
          elif [ "$ACTUAL_MARKERS" = "$EXPECTED_MARKERS" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "summary=### :white_check_mark: Schema Drift: Only known HNSW-index drift (Prisma 5.x limitation; tracked in raw-SQL migration)" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            EOF_MARKER=$(uuidgen)
            echo "summary<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
            echo "### :x: Schema Drift: schema.prisma has changes without a migration" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "Run \`npx prisma migrate dev --name <description>\` to generate the missing migration." >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo '```' >> "$GITHUB_OUTPUT"
            echo "$DIFF_OUTPUT" >> "$GITHUB_OUTPUT"
            echo '```' >> "$GITHUB_OUTPUT"
            echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    name: Backend Tests (Vitest)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      summary: ${{ steps.parse.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true

      - name: Checkout (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        id: checkout-retry1
        continue-on-error: true

      - name: Checkout (retry 2)
        if: steps.checkout-retry1.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: packages/backend

      - name: TypeScript Type Check (Backend)
        run: npx tsc --noEmit
        working-directory: packages/backend

      - name: TypeScript Type Check (Frontend)
        run: npx tsc --noEmit
        working-directory: packages/frontend

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-results.json 2>&1 || true
        working-directory: packages/backend

      - name: Parse Test Results
        if: always()
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let status = 'pass';
            let summary = '';
            try {
              const raw = fs.readFileSync('packages/backend/vitest-results.json', 'utf8');
              const results = JSON.parse(raw);
              const passed = results.numPassedTests || 0;
              const failed = results.numFailedTests || 0;
              const total = results.numTotalTests || 0;
              if (failed > 0) {
                status = 'fail';
                const failedSuites = (results.testResults || [])
                  .filter(s => s.status === 'failed')
                  .map(s => `- \`${s.name.replace(/.*\/packages\//, 'packages/')}\``)
                  .slice(0, 10)
                  .join('\n');
                summary = `### :x: Tests: ${failed}/${total} failed\n\n${failedSuites}`;
              } else {
                summary = `### :white_check_mark: Tests: ${passed}/${total} passed`;
              }
            } catch (e) {
              status = 'fail';
              summary = `### :x: Tests: Could not parse results\n\nError: ${e.message}`;
            }
            core.setOutput('status', status);
            core.setOutput('summary', summary);

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: packages/backend/vitest-results.json
          if-no-files-found: ignore

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      summary: ${{ steps.parse.outputs.summary }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: credentials
          POSTGRES_PASSWORD: credentials_dev_password
          POSTGRES_DB: credentials
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U credentials"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: s3
        ports:
          - 4566:4566
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: packages/backend

      - name: Run Database Migrations
        run: npx prisma migrate deploy
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql://credentials:credentials_dev_password@localhost:5433/credentials

      - name: Create S3 Bucket
        run: |
          pip install awscli-local awscli 2>/dev/null || true
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test \
            aws --endpoint-url=http://localhost:4566 s3 mb s3://credentials-documents 2>/dev/null || true

      - name: Start Backend
        run: |
          node --import tsx src/index.ts &
          echo $! > /tmp/backend.pid
        working-directory: packages/backend
        env:
          DATABASE_URL: postgresql://credentials:credentials_dev_password@localhost:5433/credentials
          NODE_ENV: development
          PORT: 3002
          FRONTEND_URL: http://localhost:5190
          JWT_SECRET: e2e-test-secret-key
          DEV_AUTH_BYPASS: 'true'
          USE_LOCALSTACK: 'true'
          S3_ENDPOINT: http://localhost:4566
          S3_BUCKET_NAME: credentials-documents
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Wait for Backend
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:3002/health | grep -q '"ready":true'; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Start Frontend
        run: |
          npx vite --port 5190 &
          echo $! > /tmp/frontend.pid
        working-directory: packages/frontend
        env:
          VITE_DEV_AUTH_BYPASS: 'true'
          VITE_API_URL: http://localhost:3002

      - name: Wait for Frontend
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:5190 > /dev/null 2>&1; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run Playwright Tests
        id: tests
        continue-on-error: true
        run: npx playwright test --config=e2e/playwright.config.ts --reporter=json 2>&1 | tee playwright-results.json || true

      - name: Parse E2E Results
        if: always()
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let status = 'pass';
            let summary = '';
            try {
              const raw = fs.readFileSync('playwright-results.json', 'utf8');
              const results = JSON.parse(raw);
              const suites = results.suites || [];
              let passed = 0, failed = 0, skipped = 0;
              function countTests(suite) {
                for (const spec of (suite.specs || [])) {
                  for (const test of (spec.tests || [])) {
                    const status = test.results?.[0]?.status || test.status;
                    if (status === 'passed' || status === 'expected') passed++;
                    else if (status === 'skipped') skipped++;
                    else failed++;
                  }
                }
                for (const child of (suite.suites || [])) {
                  countTests(child);
                }
              }
              for (const suite of suites) countTests(suite);
              const total = passed + failed + skipped;
              if (failed > 0) {
                status = 'fail';
                summary = `### :x: E2E Tests: ${failed}/${total} failed (${passed} passed)`;
              } else {
                summary = `### :white_check_mark: E2E Tests: ${passed}/${total} passed`;
              }
            } catch (e) {
              summary = `### :grey_question: E2E Tests: Could not parse results\n\nError: ${e.message}`;
            }
            core.setOutput('status', status);
            core.setOutput('summary', summary);

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  # Starts the COMPILED server the way Render does. This is deliberately not
  # covered by E2E Tests, which runs `node --import tsx src/index.ts` from
  # TypeScript source — tsx resolves ESM/CJS interop differently, so it happily
  # loaded a CommonJS package whose dependency was ESM-only while `node
  # dist/index.js` died on it with ERR_REQUIRE_ESM. Typecheck and 538 unit tests
  # were green on a build that could not start (PR #522 -> #525).
  boot-smoke:
    name: Boot Smoke (compiled server)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      summary: ${{ steps.parse.outputs.summary }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: credentials
          POSTGRES_PASSWORD: credentials_dev_password
          POSTGRES_DB: credentials
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U credentials"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true

      - name: Checkout (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4

      # Every job reads .nvmrc, but for this one it is load-bearing rather than
      # merely tidy: require() of an ES module was unflagged in Node 20.19 /
      # 22.12, so the ERR_REQUIRE_ESM crash that took down the staging boot does
      # NOT reproduce on Node 20 or on a modern local Node. It only reproduces on
      # the version production actually runs, which .nvmrc pins to 22.11.0. Do
      # not pin this job to a bare major — it would pass that bug straight through.
      - name: Setup Node.js (production version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: packages/backend

      - name: Build Backend
        run: npm run build --workspace=packages/backend

      - name: Boot Compiled Server
        id: boot
        continue-on-error: true
        working-directory: packages/backend
        env:
          # The health check only issues SELECT 1, so an empty database is fine
          # and no migrations are needed. Redis is left unconfigured on purpose:
          # it reports not_configured rather than degrading the health status.
          DATABASE_URL: postgresql://credentials:credentials_dev_password@localhost:5433/credentials
          NODE_ENV: development
          PORT: 3002
          FRONTEND_URL: http://localhost:5190
          JWT_SECRET: boot-smoke-secret-key
          DEV_AUTH_BYPASS: 'true'
          AWS_REGION: us-east-1
        run: |
          node dist/index.js > /tmp/boot.log 2>&1 &
          BOOT_PID=$!
          for i in $(seq 1 45); do
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then
              echo "::error::Compiled server exited during startup"
              tail -40 /tmp/boot.log
              exit 1
            fi
            if curl -sf http://localhost:3002/health 2>/dev/null | grep -q '"ready":true'; then
              echo "Compiled server booted and reported ready"
              kill "$BOOT_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::Compiled server never became ready within 90s"
          tail -40 /tmp/boot.log
          kill "$BOOT_PID" 2>/dev/null || true
          exit 1

      - name: Record Result
        if: always()
        id: parse
        run: |
          if [ "${{ steps.boot.outcome }}" = "success" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "summary=### :white_check_mark: Boot Smoke: compiled server started and reported ready" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "summary=### :x: Boot Smoke: the compiled server failed to start — see the Boot Smoke job log" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Boot Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-log
          path: /tmp/boot.log
          if-no-files-found: ignore

  # Multi-tenancy guardrail. Runs ONE test file — the tenant-scope coverage
  # scan — as its own blocking check.
  #
  # This test has existed since July and has been failing since July. Nothing
  # stopped it, because Backend Tests runs with `|| true` and is excluded from
  # the blocking set, so a red tenant-isolation test is indistinguishable from
  # a flaky snapshot. While it sat red, a route that reads any practice's
  # provider NPI shipped to production (defacto.routes.ts, PR #519/#520).
  #
  # Split out rather than making the whole backend suite blocking: an ordinary
  # unit-test failure should not wedge every merge, but a cross-tenant data
  # leak should. Needs no database, no Prisma client and no shared build — the
  # test only reads schema.prisma and route source off disk.
  tenant-scope:
    name: Tenant Scope Guardrail
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parse.outputs.status }}
      summary: ${{ steps.parse.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        id: checkout
        continue-on-error: true

      - name: Checkout (retry 1)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Setup Node.js (production version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # No `|| true` here, unlike Backend Tests. A failure must fail the job.
      #
      # partner-api.routes.test.ts runs here rather than in the general backend
      # suite on purpose: it is the only enforcement of the customer-facing
      # response allow-list and of cross-practice isolation on the one surface
      # exposed outside the app. In a `|| true` job those assertions would be
      # decorative.
      - name: Run Tenant-Scope Coverage Test
        id: scan
        continue-on-error: true
        working-directory: packages/backend
        run: >-
          ../../node_modules/.bin/vitest run
          tests/tenant-scope-coverage.test.ts
          src/routes/partner-api.routes.test.ts

      - name: Record Result
        if: always()
        id: parse
        run: |
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "summary=### :white_check_mark: Tenant Scope: every route touching tenant-scoped tables is scoped or allowlisted; partner API response allow-list and cross-practice isolation hold" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "summary=### :x: Tenant Scope: a route reads or writes tenant-scoped tables without scoping — see the Tenant Scope Guardrail job log for the file and the three fix paths" >> "$GITHUB_OUTPUT"
          fi

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [gitleaks, npm-audit, eslint-security, semgrep, backend-tests, e2e-tests, schema-drift, boot-smoke, tenant-scope]
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
        continue-on-error: true

      - name: Aggregate Results and Comment on PR
        uses: actions/github-script@v7
        env:
          GITLEAKS_STATUS: ${{ needs.gitleaks.outputs.status }}
          GITLEAKS_SUMMARY: ${{ needs.gitleaks.outputs.summary }}
          NPM_AUDIT_STATUS: ${{ needs.npm-audit.outputs.status }}
          NPM_AUDIT_SUMMARY: ${{ needs.npm-audit.outputs.summary }}
          ESLINT_STATUS: ${{ needs.eslint-security.outputs.status }}
          ESLINT_SUMMARY: ${{ needs.eslint-security.outputs.summary }}
          SEMGREP_STATUS: ${{ needs.semgrep.outputs.status }}
          SEMGREP_SUMMARY: ${{ needs.semgrep.outputs.summary }}
          TESTS_STATUS: ${{ needs.backend-tests.outputs.status }}
          TESTS_SUMMARY: ${{ needs.backend-tests.outputs.summary }}
          E2E_STATUS: ${{ needs.e2e-tests.outputs.status }}
          E2E_SUMMARY: ${{ needs.e2e-tests.outputs.summary }}
          SCHEMA_DRIFT_STATUS: ${{ needs.schema-drift.outputs.status }}
          SCHEMA_DRIFT_SUMMARY: ${{ needs.schema-drift.outputs.summary }}
          BOOT_STATUS: ${{ needs.boot-smoke.outputs.status }}
          BOOT_SUMMARY: ${{ needs.boot-smoke.outputs.summary }}
          TENANT_SCOPE_STATUS: ${{ needs.tenant-scope.outputs.status }}
          TENANT_SCOPE_SUMMARY: ${{ needs.tenant-scope.outputs.summary }}
        with:
          script: |
            const gitleaksStatus = process.env.GITLEAKS_STATUS || 'unknown';
            const gitleaksSummary = process.env.GITLEAKS_SUMMARY || '### :grey_question: Gitleaks: No results available';
            const npmAuditStatus = process.env.NPM_AUDIT_STATUS || 'unknown';
            const npmAuditSummary = process.env.NPM_AUDIT_SUMMARY || '### :grey_question: npm audit: No results available';
            const eslintStatus = process.env.ESLINT_STATUS || 'unknown';
            const eslintSummary = process.env.ESLINT_SUMMARY || '### :grey_question: ESLint Security: No results available';
            const semgrepStatus = process.env.SEMGREP_STATUS || 'unknown';
            const semgrepSummary = process.env.SEMGREP_SUMMARY || '### :grey_question: Semgrep: No results available';
            const testsStatus = process.env.TESTS_STATUS || 'unknown';
            const testsSummary = process.env.TESTS_SUMMARY || '### :grey_question: Tests: No results available';
            const e2eStatus = process.env.E2E_STATUS || 'unknown';
            const e2eSummary = process.env.E2E_SUMMARY || '### :grey_question: E2E Tests: No results available';
            const schemaDriftStatus = process.env.SCHEMA_DRIFT_STATUS || 'unknown';
            const schemaDriftSummary = process.env.SCHEMA_DRIFT_SUMMARY || '### :grey_question: Schema Drift: No results available';
            const bootStatus = process.env.BOOT_STATUS || 'unknown';
            const bootSummary = process.env.BOOT_SUMMARY || '### :grey_question: Boot Smoke: No results available';
            const tenantScopeStatus = process.env.TENANT_SCOPE_STATUS || 'unknown';
            const tenantScopeSummary = process.env.TENANT_SCOPE_SUMMARY || '### :grey_question: Tenant Scope: No results available';

            // Detect infrastructure failure: all jobs failed to produce results
            const allStatuses = [gitleaksStatus, npmAuditStatus, eslintStatus, semgrepStatus, testsStatus, e2eStatus, schemaDriftStatus, bootStatus, tenantScopeStatus];
            const allUnknown = allStatuses.every(s => s === 'unknown' || s === '');

            if (allUnknown) {
              core.warning('All scan jobs failed to produce results — likely a GitHub infrastructure issue. Re-run the workflow.');

              const infraBody = [
                '## :construction: Security Scan Results — Infrastructure Issue',
                '',
                '**All 6 scan jobs failed to produce results.** This is likely caused by a transient GitHub infrastructure issue (e.g. 500/502 during checkout), not by actual security findings.',
                '',
                ':arrow_right: **Action:** Re-run the workflow. If the problem persists, check [GitHub Status](https://www.githubstatus.com/).',
                '',
                '---',
                '',
                gitleaksSummary,
                '',
                '---',
                '',
                npmAuditSummary,
                '',
                '---',
                '',
                eslintSummary,
                '',
                '---',
                '',
                semgrepSummary,
                '',
                '---',
                '',
                testsSummary,
                '',
                '---',
                '',
                e2eSummary,
                '',
                '---',
                '',
                schemaDriftSummary,
                '',
                '---',
                '',
                bootSummary,
                '',
                '---',
                '',
                tenantScopeSummary,
                '',
                '---',
                '',
                `*Scan attempted at ${new Date().toISOString()}*`,
              ].join('\n');

              if (context.eventName === 'pull_request') {
                const prNumber = context.payload.pull_request.number;
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                });
                const marker = '<!-- security-scan-results -->';
                const existing = comments.data.find(c => c.body.includes(marker));
                const fullBody = marker + '\n' + infraBody;
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: fullBody,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: fullBody,
                  });
                }
              }

              await core.summary.addRaw(infraBody).write();
              // Don't fail the gate on infrastructure issues
              return;
            }

            // Security scans, schema drift, the boot smoke and the tenant-scope
            // guardrail block merges; tests are informational. A build that cannot
            // start is worse than a failing test, and a route that reads another
            // practice's data is worse still — so both are in the blocking set
            // rather than alongside the informational suites.
            const securityStatuses = [gitleaksStatus, npmAuditStatus, eslintStatus, semgrepStatus, schemaDriftStatus, bootStatus, tenantScopeStatus];
            const anyFailed = securityStatuses.includes('fail');
            const testsHaveFailures = [testsStatus, e2eStatus].includes('fail');

            const overallIcon = anyFailed ? ':rotating_light:' : ':shield:';
            const overallText = anyFailed
              ? 'Security issues were found that must be resolved before merging.'
              : testsHaveFailures
                ? 'All security scans passed. Test failures are informational and do not block merging.'
                : 'All security scans passed.';

            const body = [
              `## ${overallIcon} Security Scan Results`,
              '',
              overallText,
              '',
              '---',
              '',
              gitleaksSummary,
              '',
              '---',
              '',
              npmAuditSummary,
              '',
              '---',
              '',
              eslintSummary,
              '',
              '---',
              '',
              semgrepSummary,
              '',
              '---',
              '',
              testsSummary,
              '',
              '---',
              '',
              e2eSummary,
              '',
              '---',
              '',
              bootSummary,
              '',
              '---',
              '',
              tenantScopeSummary,
              '',
              '---',
              '',
              `*Scan completed at ${new Date().toISOString()}*`,
            ].join('\n');

            // Post comment on PR (sticky - update existing or create new)
            if (context.eventName === 'pull_request') {
              const prNumber = context.payload.pull_request.number;
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              const marker = '<!-- security-scan-results -->';
              const existing = comments.data.find(c => c.body.includes(marker));
              const fullBody = marker + '\n' + body;

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: fullBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: fullBody,
                });
              }
              core.info('Posted security scan results as PR comment');
            } else {
              core.info('Not a PR event, skipping comment. Results logged to workflow summary.');
            }

            // Write to workflow summary
            await core.summary
              .addRaw(body)
              .write();

            // Fail the gate if any scan found high/critical issues
            if (anyFailed) {
              core.setFailed('Security scan found HIGH or CRITICAL issues. See PR comment or workflow summary for details.');
            }

      - name: Report to Linear
        if: failure()
        uses: actions/github-script@v7
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          GITLEAKS_STATUS: ${{ needs.gitleaks.outputs.status }}
          NPM_AUDIT_STATUS: ${{ needs.npm-audit.outputs.status }}
          ESLINT_STATUS: ${{ needs.eslint-security.outputs.status }}
          SEMGREP_STATUS: ${{ needs.semgrep.outputs.status }}
          TESTS_STATUS: ${{ needs.backend-tests.outputs.status }}
          E2E_STATUS: ${{ needs.e2e-tests.outputs.status }}
          SCHEMA_DRIFT_STATUS: ${{ needs.schema-drift.outputs.status }}
          # Both of these were referenced in the checks array below without
          # being passed in — BOOT_STATUS since #526 — so a failing job read as
          # undefined and never reached Linear.
          BOOT_STATUS: ${{ needs.boot-smoke.outputs.status }}
          TENANT_SCOPE_STATUS: ${{ needs.tenant-scope.outputs.status }}
        with:
          script: |
            if (!process.env.LINEAR_API_KEY || !process.env.LINEAR_TEAM_ID) {
              console.log('LINEAR_API_KEY or LINEAR_TEAM_ID not set — skipping Linear reporting');
              return;
            }

            const LINEAR_API = 'https://api.linear.app/graphql';
            const headers = {
              'Authorization': process.env.LINEAR_API_KEY,
              'Content-Type': 'application/json'
            };

            async function linearQuery(query, variables = {}) {
              const res = await fetch(LINEAR_API, {
                method: 'POST',
                headers,
                body: JSON.stringify({ query, variables })
              });
              if (!res.ok) {
                console.log(`Linear API error: ${res.status} ${await res.text()}`);
                return null;
              }
              return (await res.json()).data;
            }

            // Collect which checks failed
            const checks = [
              { name: 'Gitleaks', status: process.env.GITLEAKS_STATUS },
              { name: 'npm audit', status: process.env.NPM_AUDIT_STATUS },
              { name: 'ESLint Security', status: process.env.ESLINT_STATUS },
              { name: 'Semgrep', status: process.env.SEMGREP_STATUS },
              { name: 'Backend Tests', status: process.env.TESTS_STATUS },
              { name: 'E2E Tests', status: process.env.E2E_STATUS },
              { name: 'Schema Drift', status: process.env.SCHEMA_DRIFT_STATUS },
              { name: 'Boot Smoke', status: process.env.BOOT_STATUS },
              { name: 'Tenant Scope Guardrail', status: process.env.TENANT_SCOPE_STATUS },
            ];
            const failed = checks.filter(c => c.status === 'fail');
            const failedList = failed.map(c => `- **${c.name}**: failed`).join('\n');

            // 1. Check for existing open issue
            const searchData = await linearQuery(`
              query($teamId: ID!) {
                issues(filter: {
                  team: { id: { eq: $teamId } },
                  title: { contains: "[CI] Security Gate Failed" },
                  state: { type: { nin: ["completed", "canceled"] } }
                }, first: 1) {
                  nodes { id title }
                }
              }
            `, { teamId: process.env.LINEAR_TEAM_ID });

            const existingIssue = searchData?.issues?.nodes?.[0];
            const branch = context.ref?.replace('refs/heads/', '') || 'unknown';
            const sha = context.sha?.substring(0, 7) || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prLink = context.eventName === 'pull_request'
              ? `**PR:** #${context.payload.pull_request.number}`
              : '';
            const details = [
              `**Branch:** ${branch}`,
              `**Commit:** ${sha}`,
              prLink,
              `**Run:** ${runUrl}`,
              `**Time:** ${new Date().toISOString()}`,
              '',
              '### Failed Checks',
              failedList || '- No specific check failures detected',
            ].filter(Boolean).join('\n');

            if (existingIssue) {
              // 2. Add comment to existing issue
              await linearQuery(`
                mutation($issueId: String!, $body: String!) {
                  commentCreate(input: { issueId: $issueId, body: $body }) {
                    success
                  }
                }
              `, {
                issueId: existingIssue.id,
                body: `### Security Gate Failed Again\n\n${details}`
              });
              console.log(`Added comment to existing Linear issue: ${existingIssue.title}`);
            } else {
              // 3. Create new issue
              const result = await linearQuery(`
                mutation($title: String!, $description: String!, $teamId: String!, $priority: Int!) {
                  issueCreate(input: {
                    title: $title,
                    description: $description,
                    teamId: $teamId,
                    priority: $priority
                  }) {
                    success
                    issue { id url identifier }
                  }
                }
              `, {
                title: `[CI] Security Gate Failed — ${branch}`,
                description: `## Security Gate Failure\n\n${details}\n\n---\n*Created by Lanyard Bug Monitor (GitHub Actions)*`,
                teamId: process.env.LINEAR_TEAM_ID,
                priority: 2
              });
              console.log('Created new Linear issue for security gate failure');
              if (result?.issueCreate?.issue?.url) {
                console.log(`Issue URL: ${result.issueCreate.issue.url}`);
              }
            }
