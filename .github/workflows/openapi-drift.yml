name: OpenAPI Drift Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  openapi-drift:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: packages/backend

      - name: Regenerate OpenAPI Spec
        run: npm run openapi:generate --workspace=packages/backend

      - name: Check for Drift
        run: |
          if ! git diff --exit-code packages/backend/openapi.json; then
            echo ""
            echo "::error::OpenAPI spec at packages/backend/openapi.json is out of sync with the route handlers."
            echo "::error::Run 'npm run openapi:generate --workspace=packages/backend' locally and commit the regenerated file."
            exit 1
          fi
          echo "OpenAPI spec is in sync with route handlers."
