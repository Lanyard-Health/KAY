databases:
  - name: kay-db
    plan: free
    databaseName: kay
    user: kay

services:
  - type: web
    name: kay-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && cd packages/shared && npm run build && cd ../backend && npx prisma generate && npm run build
    startCommand: cd packages/backend && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kay-db
          property: connectionString
      - key: DEV_AUTH_BYPASS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://kay-frontend.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-20250514
      - key: AI_DAILY_TOKEN_BUDGET
        value: "100000"

  - type: web
    name: kay-frontend
    runtime: static
    plan: free
    buildCommand: npm ci --include=dev && cd packages/shared && npm run build && cd ../frontend && npm run build
    staticPublishPath: packages/frontend/dist
    envVars:
      - key: VITE_DEV_AUTH_BYPASS
        value: "true"
      - key: VITE_API_URL
        value: https://kay-os62.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
