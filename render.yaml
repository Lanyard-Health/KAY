databases:
  - name: kay-db
    plan: free
    databaseName: kay
    user: kay

services:
  - type: web
    name: kay-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && cd packages/shared && npm run build && cd ../backend && npx prisma generate && npx playwright install --with-deps chromium && npm run build
    startCommand: cd packages/backend && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://kay-frontend.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-4-20250514
      - key: AI_DAILY_TOKEN_BUDGET
        value: "100000"
      - key: AETNA_PORTAL_URL
        value: https://extaz-oci.aetna.com/pocui/join-the-aetna-network

      # Redis & queues
      - key: REDIS_URL
        sync: false

      # Auth (Cognito)
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_CLIENT_ID
        sync: false

      # Email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        value: kay@lanyardhealth.com

      # Storage (S3)
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Observability (Sentry, Linear)
      - key: SENTRY_DSN
        sync: false
      - key: LINEAR_API_KEY
        sync: false
      - key: LINEAR_TEAM_ID
        sync: false
      - key: LINEAR_BUG_MONITOR_ENABLED
        value: "true"

      # AI (OpenAI for embeddings)
      - key: OPENAI_API_KEY
        sync: false

      # CAQH integration
      - key: CAQH_API_URL
        value: https://proview.caqh.org
      - key: CAQH_ORG_ID
        sync: false
      - key: CAQH_USERNAME
        sync: false
      - key: CAQH_PASSWORD
        sync: false

      # App config
      - key: APP_URL
        value: https://kay-frontend.onrender.com

  - type: web
    name: kay-frontend
    runtime: static
    plan: free
    buildCommand: npm ci --include=dev && cd packages/shared && npm run build && cd ../frontend && npx vite build
    staticPublishPath: packages/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://kay-os62.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
